services:
  postgres:
    image: postgres:16-alpine
    container_name: dowhiz-local-postgres
    environment:
      POSTGRES_DB: dowhiz_local
      POSTGRES_USER: dowhiz
      POSTGRES_PASSWORD: dowhiz
    ports:
      - "5432:5432"
    volumes:
      - dowhiz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dowhiz -d dowhiz_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: dowhiz-local-mongo
    ports:
      - "27017:27017"
    volumes:
      - dowhiz-mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dowhiz-postgres-data:
  dowhiz-mongo-data:
