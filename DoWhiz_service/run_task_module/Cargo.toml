[package]
name = "run_task_module"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
mongodb = { version = "2.8", default-features = false, features = ["sync", "bson-chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
std-semaphore = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
send_emails_module = { path = "../send_emails_module" }

[[bin]]
name = "load_test"
path = "src/bin/load_test.rs"

[[bin]]
name = "timing_cli"
path = "src/bin/timing_cli.rs"
