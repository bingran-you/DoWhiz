name: CICD_staging_frontend

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/CICD-staging-frontend.yml
      - website/**
  workflow_dispatch:

concurrency:
  group: cicd-staging-frontend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Create .env.local file
        run: |
          echo "VITE_API_BASE=${{ secrets.STAGING_VITE_API_BASE }}" > .env.local

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
        continue-on-error: true

      - name: Build the application
        run: npm run build

      - name: Archive frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: website/dist
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-dist

      - name: Create SSH Directory
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Decode SSH Private Key
        run: |
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/private_key.pem
          chmod 600 ~/.ssh/private_key.pem

      - name: Validate staging SSH secrets
        env:
          STAGING_AZURE_VM_IP: ${{ secrets.STAGING_AZURE_VM_IP }}
          STAGING_AZURE_VM_USER: ${{ secrets.STAGING_AZURE_VM_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$STAGING_AZURE_VM_IP" ]] || { echo "Missing staging secret: STAGING_AZURE_VM_IP" >&2; exit 1; }
          [[ -n "$STAGING_AZURE_VM_USER" ]] || { echo "Missing staging secret: STAGING_AZURE_VM_USER" >&2; exit 1; }
          [[ -n "$STAGING_SSH_PRIVATE_KEY" ]] || { echo "Missing staging secret: STAGING_SSH_PRIVATE_KEY" >&2; exit 1; }

      - name: Add Azure VM to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.STAGING_AZURE_VM_IP }}" >> ~/.ssh/known_hosts

      - name: Create SSH config file
        run: |
          echo "Host azurestaging" >> ~/.ssh/config
          echo "  HostName ${{ secrets.STAGING_AZURE_VM_IP }}" >> ~/.ssh/config
          echo "  User ${{ secrets.STAGING_AZURE_VM_USER }}" >> ~/.ssh/config
          echo "  Port 22" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/private_key.pem" >> ~/.ssh/config

      - name: Backup old frontend build
        run: |
          ssh -F ~/.ssh/config azurestaging << 'EOF'
          CUR_TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          FRONTEND_DIR=/home/${{ secrets.STAGING_AZURE_VM_USER }}/server/DoWhiz_frontend/website
          if [ -d "$FRONTEND_DIR/dist" ]; then
            mv "$FRONTEND_DIR/dist" "$FRONTEND_DIR/dist_backup_${CUR_TIMESTAMP}"
          fi
          mkdir -p "$FRONTEND_DIR/dist"
          EOF

      - name: Upload frontend build to Azure VM
        run: |
          scp -r -F ~/.ssh/config ./frontend-dist/* azurestaging:/home/${{ secrets.STAGING_AZURE_VM_USER }}/server/DoWhiz_frontend/website/dist/

      - name: Create frontend .env.local on Azure VM
        run: |
          ssh -F ~/.ssh/config azurestaging << EOF
          echo "VITE_API_BASE=${{ secrets.STAGING_VITE_API_BASE }}" > /home/${{ secrets.STAGING_AZURE_VM_USER }}/server/DoWhiz_frontend/website/.env.local
          EOF

      - name: Update frontend repo and install dependencies
        run: |
          ssh -F ~/.ssh/config azurestaging << 'EOF'
          cd /home/${{ secrets.STAGING_AZURE_VM_USER }}/server/DoWhiz_frontend
          git fetch origin
          git checkout -f dev
          git pull origin dev
          cd website
          npm install
          EOF

      - name: Restart frontend service
        run: |
          ssh -F ~/.ssh/config azurestaging << 'EOF'
          set -e
          if [ -s /home/${{ secrets.STAGING_AZURE_VM_USER }}/.nvm/nvm.sh ]; then
            source /home/${{ secrets.STAGING_AZURE_VM_USER }}/.nvm/nvm.sh
          fi
          FRONTEND_DIR=/home/${{ secrets.STAGING_AZURE_VM_USER }}/server/DoWhiz_frontend/website

          if pm2 describe dw_frontend >/dev/null 2>&1; then
            pm2 restart dw_frontend --update-env
          else
            pm2 start npm --name dw_frontend --cwd "$FRONTEND_DIR" -- run preview -- --host 0.0.0.0 --port 3000
          fi

          pm2 save

          # Health check for frontend
          for attempt in $(seq 1 12); do
            http_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 8 --max-time 15 "http://127.0.0.1:3000" || true)"
            if [[ "$http_code" == "200" ]]; then
              echo "Frontend health check passed: HTTP $http_code"
              exit 0
            fi
            echo "Waiting for frontend (${attempt}/12), last HTTP ${http_code:-000}..."
            sleep 5
          done
          echo "Frontend health check failed after retries" >&2
          exit 1
          EOF
